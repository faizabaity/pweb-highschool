<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak | SMAN 3 Malang</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="kontak-page">
    <header class="topbar">
      <div class="brand">
        <img src="assets/images/logo.png" alt="Logo SMA Negeri 3 Malang" />
      </div>
      <nav class="nav" aria-label="Navigasi utama">
        <a href="index.html">BERANDA</a>
        <a href="jurusan.html">JURUSAN</a>
        <a href="kontak.html">KONTAK</a>
      </nav>
    </header>

    <main class="kontak-main">
      <h1 class="kontak-title">Kontak <span class="accent">SMA Negeri 3 Malang</span></h1>

      <div class="kontak-layout">
        <div class="contact-form-panel">
          <form class="contact-form">
            <input type="text" placeholder="Nama Anda" aria-label="Nama Anda" />
            <textarea placeholder="Pesan Anda" aria-label="Pesan Anda"></textarea>
            <button type="submit">Kirim</button>
          </form>
        </div>

        <div class="contact-info" aria-label="Informasi kontak">
          <div class="info-row">
            <div class="icon" aria-hidden="true">
              <img src="assets/images/pin.png" alt="Alamat" />
            </div>
            <div>
              <p class="label">ALAMAT:</p>
              <p class="value">Jl. Sultan Agung Utara no. 7 Malang 65144, Jawa Timur - Indonesia</p>
            </div>
          </div>

          <div class="info-row">
            <div class="icon" aria-hidden="true">
              <img src="assets/images/phone.png" alt="Telepon" />
            </div>
            <div>
              <p class="label">TELEPON:</p>
              <p class="value">+62 341 324768</p>
            </div>
          </div>

          <div class="info-row">
            <div class="icon" aria-hidden="true">
              <img src="assets/images/fax.png" alt="Fax" />
            </div>
            <div>
              <p class="label">FAX:</p>
              <p class="value">+62 341 341530</p>
            </div>
          </div>

          <div class="info-row">
            <div class="icon" aria-hidden="true">
              <img src="assets/images/email.png" alt="Email" />
            </div>
            <div>
              <p class="label">EMAIL:</p>
              <p class="value">humas@sman3-malang.sch.id</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <p class="copyright">Copyright © by SMAN 3 Malang. All Rights Reserved.</p>
        <div class="socials" aria-label="Sosial media">
          <a href="https://www.youtube.com/@SMANegeri3Malang" aria-label="LinkedIn"><img src="assets/images/linkedin.png" alt="LinkedIn" /></a>
          <a href="https://instagram.com/sman3malang" aria-label="Instagram"><img src="assets/images/instagram.png" alt="Instagram" /></a>
          <a href="https://www.linkedin.com/school/sman3-malang/" aria-label="YouTube"><img src="assets/images/youtube.png" alt="YouTube" /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
